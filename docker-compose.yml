# LíderSign: banco + app (o Nest serve a API e o site na mesma porta) + túnel HTTPS.
#   docker compose up --build      ->  http://localhost:3000
#
# O túnel dá aos links de assinatura um endereço https://….trycloudflare.com, para o
# celular abrir em qualquer rede. Ele é público enquanto estiver rodando: desligue com
# docker compose stop tunnel (os links voltam a usar WEB_PUBLIC_URL).
#
# Valores de demo abaixo. Para mudar sem editar este arquivo, crie um .env na raiz
# (veja .env.example): o compose lê as variáveis de lá automaticamente.

name: lidersign

services:
    db:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: lidersign
            POSTGRES_PASSWORD: lidersign
            POSTGRES_DB: lidersign
        volumes:
            - db-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U lidersign -d lidersign']
            interval: 5s
            timeout: 5s
            retries: 20
        # O banco não fica exposto fora do Docker. Para inspecionar: ports: ['127.0.0.1:5432:5432']

    app:
        build: .
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
        env_file:
            - path: .env
              required: false
        environment:
            NODE_ENV: production
            PORT: 3000
            API_PORT: 3000
            DATABASE_URL: postgresql://lidersign:lidersign@db:5432/lidersign
            # Chave de parceiro da LíderHub. TROQUE fora da demo: openssl rand -hex 32
            PARTNER_API_KEY: ${PARTNER_API_KEY:-demo-partner-key-troque-em-producao}
            DEMO_MODE: ${DEMO_MODE:-true}
            DEMO_TENANT_ID: ${DEMO_TENANT_ID:-escritorio-demo}
            # Endereço dos links quando o túnel não está no ar
            WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
            # O app lê a URL do túnel nas métricas do cloudflared e passa a usá-la nos links
            TUNNEL_METRICS_URL: ${TUNNEL_METRICS_URL-http://tunnel:2000}
            WEB_DIST_DIR: /app/web/dist
            STORAGE_DIR: /data/storage
            CERT_DIR: /data/certs
            # Senha do certificado de selagem gerado no primeiro boot. Em produção: e-CNPJ A1 no cofre
            SEAL_CERT_PASSPHRASE: ${SEAL_CERT_PASSPHRASE:-demo-troque-esta-senha}
            # Carimbo do tempo RFC 3161. Defina TSA_URL= (vazio) para desligar.
            TSA_URL: ${TSA_URL-https://freetsa.org/tsr}
            # Confia no X-Forwarded-For de 1 salto (o túnel). Acesso direto pela porta registra o IP do Docker.
            TRUST_PROXY: ${TRUST_PROXY:-1}
            # Hosts que podem receber webhooks (proteção contra SSRF). A demo entrega para o próprio app.
            WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-localhost,127.0.0.1}
            # simulator (padrão, sem conta) ou cloud_api (WhatsApp oficial da Meta)
            WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-simulator}
            WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
            WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
            WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v23.0}
            # Opcional: IA para transformar contrato em modelo. Sem chave, usa regras locais.
            ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
            AI_MODEL: ${AI_MODEL:-claude-sonnet-5-5}
        ports:
            # Site + API. Porta no seu computador: APP_PORT no .env (padrão 3000).
            # O MCP do agente usa LIDERSIGN_API_URL=http://localhost:<APP_PORT>/v1
            - '${APP_PORT:-3000}:3000'
        volumes:
            - app-data:/data

    tunnel:
        # Túnel rápido da Cloudflare: sem conta, HTTPS, URL nova a cada vez que sobe
        image: cloudflare/cloudflared:2026.5.0
        restart: unless-stopped
        command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://app:3000
        depends_on:
            - app

volumes:
    db-data:
    app-data:
