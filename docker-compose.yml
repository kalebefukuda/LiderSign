name: lidersign

services:
    db:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: lidersign
            POSTGRES_PASSWORD: lidersign
            POSTGRES_DB: lidersign
        volumes:
            - db-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U lidersign -d lidersign']
            interval: 5s
            timeout: 5s
            retries: 20

    app:
        build: .
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
        env_file:
            - path: .env
              required: false
        environment:
            NODE_ENV: production
            PORT: 3000
            API_PORT: 3000
            DATABASE_URL: postgresql://lidersign:lidersign@db:5432/lidersign
            PARTNER_API_KEY: ${PARTNER_API_KEY:-demo-partner-key-troque-em-producao}
            DEMO_MODE: ${DEMO_MODE:-true}
            DEMO_TENANT_ID: ${DEMO_TENANT_ID:-escritorio-demo}
            WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
            TUNNEL_METRICS_URL: ${TUNNEL_METRICS_URL-http://tunnel:2000}
            WEB_DIST_DIR: /app/web/dist
            STORAGE_DIR: /data/storage
            CERT_DIR: /data/certs
            SEAL_CERT_PASSPHRASE: ${SEAL_CERT_PASSPHRASE:-demo-troque-esta-senha}
            TSA_URL: ${TSA_URL-https://freetsa.org/tsr}
            TRUST_PROXY: ${TRUST_PROXY:-1}
            WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-localhost,127.0.0.1}
            WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-simulator}
            WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
            WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
            WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v23.0}
            ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
            AI_MODEL: ${AI_MODEL:-claude-sonnet-5-5}
        ports:
            - '${APP_PORT:-3000}:3000'
        volumes:
            - app-data:/data

    tunnel:
        image: cloudflare/cloudflared:2026.5.0
        restart: unless-stopped
        command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://app:3000
        depends_on:
            - app

volumes:
    db-data:
    app-data:
